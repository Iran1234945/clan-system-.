<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه مدیریت کلن ALLIANCE US</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');
    
    :root {
      --primary-neon: #6366f1;
      --secondary-neon: #a855f7;
      --accent-gold: #f59e0b;
      --bg-dark: #090d16;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, var(--bg-dark));
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(15, 23, 42, 0.85) !important;
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 14px;
      padding: 15px;
      transition: all 0.3s ease;
    }
    .stat-card:hover {
      border-color: var(--primary-neon);
      transform: translateY(-3px);
    }

    .form-control, .form-select {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 10px;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      border-color: var(--primary-neon);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .btn-custom {
      background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background: linear-gradient(45deg, #4f46e5, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5);
      color: white;
    }

    .chat-box {
      height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 15px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      position: relative;
    }

    .chat-me {
      align-self: flex-start;
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .chat-other {
      align-self: flex-end;
      background: rgba(51, 65, 85, 0.9);
      color: white;
      border-bottom-left-radius: 2px;
    }

    .chat-bot {
      align-self: center;
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      border-radius: 12px;
      max-width: 90%;
      text-align: center;
    }

    .table {
      color: #cbd5e1;
    }

    .table-dark {
      --bs-table-bg: rgba(15, 23, 42, 0.6);
    }

    .badge-status {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .announcement-box {
      background: linear-gradient(45deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.25));
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 15px;
    }

    .pass-text {
      font-family: monospace;
      letter-spacing: 1px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- هدر و ناوبری -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 text-warning" href="#">
        ⚡️ ALLIANCE US ⚡️
      </a>
      <div id="userInfo" class="d-flex align-items-center gap-3"></div>
    </div>
  </nav>

  <div class="container my-4 flex-grow-1">
    
    <!-- بخش ورود و ثبت نام -->
    <div id="authSection" class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4">
          <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active text-white fw-bold" id="tab-login" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">ورود اعضا</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link text-white fw-bold" id="tab-register" data-bs-toggle="pill" data-bs-target="#pills-register" type="button">ثبت نام جدید</button>
            </li>
          </ul>

          <div class="tab-content" id="pills-tabContent">
            <!-- فرم ورود -->
            <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">نام کاربری</label>
                  <input type="text" id="loginUser" class="form-control" placeholder="نام کاربری خود را وارد کنید" required autocomplete="off">
                </div>
                <div class="mb-3">
                  <label class="form-label">رمز عبور</label>
                  <input type="password" id="loginPass" class="form-control" placeholder="رمز عبور" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2">ورود به سامانه</button>
              </form>
            </div>

            <!-- فرم ثبت نام -->
            <div class="tab-pane fade" id="pills-register" role="tabpanel">
              <form id="registerForm">
                <div class="mb-3">
                  <label class="form-label">نام و نام خانوادگی / نام در بازی</label>
                  <input type="text" id="regName" class="form-control" placeholder="مثال: علی - آریا" required autocomplete="off">
                </div>
                <div class="mb-3">
                  <label class="form-label">نام کاربری جهت ورود</label>
                  <input type="text" id="regUser" class="form-control" placeholder="حروف انگلیسی" required autocomplete="off">
                </div>
                <div class="mb-3">
                  <label class="form-label">رمز عبور</label>
                  <input type="password" id="regPass" class="form-control" placeholder="رمز عبور دلخواه" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2">ارسال درخواست عضویت</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- داشبورد اصلی پس از ورود -->
    <div id="mainDashboard" class="d-none">
      
      <!-- آمار کلن -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="stat-card d-flex align-items-center justify-content-between">
            <div>
              <small class="text-muted d-block">کل اعضا</small>
              <h4 id="statTotal" class="mb-0 fw-bold text-info">0</h4>
            </div>
            <i class="fa-solid fa-users fs-2 text-info opacity-50"></i>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card d-flex align-items-center justify-content-between">
            <div>
              <small class="text-muted d-block">در انتظار تایید</small>
              <h4 id="statPending" class="mb-0 fw-bold text-warning">0</h4>
            </div>
            <i class="fa-solid fa-clock fs-2 text-warning opacity-50"></i>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card d-flex align-items-center justify-content-between">
            <div>
              <small class="text-muted d-block">وضعیت سرور</small>
              <h4 class="mb-0 fw-bold text-success">آنلاین ⚡️</h4>
            </div>
            <i class="fa-solid fa-server fs-2 text-success opacity-50"></i>
          </div>
        </div>
      </div>

      <!-- اطلاعیه کلن -->
      <div class="announcement-box mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <h6 class="mb-0 text-warning fw-bold"><i class="fa-solid fa-bullhorn me-2"></i>اطلاعیه و قوانین کلن</h6>
          <small id="announcementTime" class="text-muted"></small>
        </div>
        <p id="announcementText" class="mb-0 text-light fs-6">در حال حاضر اطلاعیه جدیدی ثبت نشده است.</p>
      </div>

      <!-- پنل لیدر / ادمین -->
      <div id="adminPanel" class="glass-card p-4 mb-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0 text-warning"><i class="fa-solid fa-user-shield me-2"></i>پنل مدیریت لیدر کلن</h4>
          <button class="btn btn-sm btn-outline-warning" data-bs-toggle="modal" data-bs-target="#announcementModal">ثبت اطلاعیه جدید</button>
        </div>
        
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead>
              <tr>
                <th>نام کاربر</th>
                <th>نام کاربری</th>
                <th>رمز عبور</th>
                <th>مقام</th>
                <th>وضعیت</th>
                <th>عملیات</th>
              </tr>
            </thead>
            <tbody id="membersTable"></tbody>
          </table>
        </div>
      </div>

      <!-- چت‌روم آنلاین زنده -->
      <div class="glass-card p-4">
        <h4 class="mb-3"><i class="fa-solid fa-comments me-2 text-info"></i>چت‌روم زنده کلن ALLIANCE US</h4>
        <div id="chatBox" class="chat-box mb-3"></div>
        <form id="chatForm" class="d-flex gap-2">
          <input type="text" id="chatInput" class="form-control" placeholder="پیام خود را بنویسید..." autocomplete="off" required>
          <button type="submit" class="btn btn-custom px-4"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>

    </div>

  </div>

  <!-- مدال ثبت اطلاعیه -->
  <div class="modal fade" id="announcementModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card text-white">
        <div class="modal-header border-bottom-0">
          <h5 class="modal-title">ارسال اطلاعیه سراسری</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <textarea id="newAnnouncementInput" class="form-control" rows="4" placeholder="متن اطلاعیه یا قوانین جدید کلن را بنویسید..."></textarea>
        </div>
        <div class="modal-footer border-top-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" id="saveAnnouncementBtn" class="btn btn-custom" data-bs-dismiss="modal">انتشار اطلاعیه</button>
        </div>
      </div>
    </div>
  </div>

  <!-- اسکریپت فایربیس و منطق برنامه‌نویسی -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD25Qf8dy99c3xaE_M-cGBUTlAlcweUIiI",
      authDomain: "alliance-us.firebaseapp.com",
      databaseURL: "https://alliance-us-default-rtdb.firebaseio.com",
      projectId: "alliance-us",
      storageBucket: "alliance-us.firebasestorage.app",
      messagingSenderId: "26796202986",
      appId: "1:26796202986:web:60074204d795edf3407093",
      measurementId: "G-P8RRRH3V00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;

    async function initAdmin() {
      const adminRef = ref(db, 'users/admin');
      await set(adminRef, {
        name: "لیدر کلن",
        username: "admin",
        pass: "6189",
        role: "admin",
        status: "approved"
      });
    }
    initAdmin();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUser').value.trim().toLowerCase();
      const pass = document.getElementById('regPass').value.trim();

      if (!username || !pass || !name) return;

      const userRef = ref(db, `users/${username}`);
      const snapshot = await get(userRef);

      if (snapshot.exists()) {
        alert("این نام کاربری قبلاً ثبت شده است!");
      } else {
        await set(userRef, {
          name: name,
          username: username,
          pass: pass,
          role: "member",
          status: "pending"
        });
        alert("درخواست ثبت‌نام شما فرستاده شد. پس از تایید لیدر می‌توانید وارد شوید.");
        document.getElementById('registerForm').reset();
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value.trim();

      const userRef = ref(db, `users/${username}`);
      const snapshot = await get(userRef);

      if (snapshot.exists()) {
        const userData = snapshot.val();
        if (userData.pass === pass) {
          if (userData.status === "approved" || userData.role === "admin") {
            currentUser = userData;
            loadDashboard();
          } else {
            alert("حساب شما هنوز توسط لیدر تایید نشده است!");
          }
        } else {
          alert("رمز عبور اشتباه است!");
        }
      } else {
        alert("کاربری با این نام یافت نشد!");
      }
    });

    function loadDashboard() {
      document.getElementById('authSection').classList.add('d-none');
      document.getElementById('mainDashboard').classList.remove('d-none');

      const roleBadge = currentUser.role === 'admin' ? '👑 لیدر' : (currentUser.role === 'co-leader' ? '⭐ معاون' : '⚔️ عضو');
      document.getElementById('userInfo').innerHTML = `
        <span class="text-light"><i class="fa-solid fa-user me-1"></i>${currentUser.name} (${roleBadge})</span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-danger">خروج</button>
      `;

      document.getElementById('logoutBtn').addEventListener('click', () => {
        location.reload();
      });

      if (currentUser.role === 'admin') {
        document.getElementById('adminPanel').classList.remove('d-none');
        listenToMembers();
      }

      listenToAnnouncements();
      listenToStats();
      listenToChat();
    }

    function listenToAnnouncements() {
      onValue(ref(db, 'announcement'), (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          document.getElementById('announcementText').innerText = data.text;
          document.getElementById('announcementTime').innerText = data.time || '';
        }
      });
    }

    document.getElementById('saveAnnouncementBtn').addEventListener('click', async () => {
      const text = document.getElementById('newAnnouncementInput').value.trim();
      if (text) {
        const timeStr = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
        await set(ref(db, 'announcement'), {
          text: text,
          time: timeStr
        });
        document.getElementById('newAnnouncementInput').value = '';
      }
    });

    function listenToStats() {
      onValue(ref(db, 'users'), (snapshot) => {
        if (snapshot.exists()) {
          const users = snapshot.val();
          let total = 0;
          let pending = 0;
          for (let key in users) {
            total++;
            if (users[key].status === 'pending') pending++;
          }
          document.getElementById('statTotal').innerText = total;
          document.getElementById('statPending').innerText = pending;
        }
      });
    }

    function listenToMembers() {
      const usersRef = ref(db, 'users');
      onValue(usersRef, (snapshot) => {
        const tbody = document.getElementById('membersTable');
        tbody.innerHTML = '';
        if (snapshot.exists()) {
          const users = snapshot.val();
          for (let key in users) {
            const u = users[key];
            if (u.role === 'admin') continue;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${u.name}</td>
              <td>${u.username}</td>
              <td><span class="pass-text">${u.pass}</span></td>
              <td>
                <select onchange="changeRole('${u.username}', this.value)" class="form-select form-select-sm" style="width: auto;">
                  <option value="member" ${u.role === 'member' ? 'selected' : ''}>⚔️ عضو</option>
                  <option value="co-leader" ${u.role === 'co-leader' ? 'selected' : ''}>⭐ معاون</option>
                </select>
              </td>
              <td>
                <span class="badge ${u.status === 'approved' ? 'bg-success' : 'bg-warning text-dark'} badge-status">
                  ${u.status === 'approved' ? 'تایید شده' : 'در انتظار تایید'}
                </span>
              </td>
              <td>
                ${u.status === 'pending' ? `<button onclick="approveUser('${u.username}')" class="btn btn-sm btn-success me-1">تایید</button>` : ''}
                <button onclick="deleteUser('${u.username}')" class="btn btn-sm btn-danger">حذف</button>
              </td>
            `;
            tbody.appendChild(tr);
          }
        }
      });
    }

    window.changeRole = async (username, role) => {
      await update(ref(db, `users/${username}`), { role: role });
    };

    window.approveUser = async (username) => {
      await update(ref(db, `users/${username}`), { status: 'approved' });
    };

    window.deleteUser = async (username) => {
      if (confirm('آیا از حذف این عضو مطمئن هستید؟')) {
        await remove(ref(db, `users/${username}`));
      }
    };

    function listenToChat() {
      const messagesRef = ref(db, 'messages');
      onValue(messagesRef, (snapshot) => {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        if (snapshot.exists()) {
          const msgs = snapshot.val();
          for (let key in msgs) {
            const m = msgs[key];
            const isMe = m.sender === currentUser.username;
            const isBot = m.sender === 'bot';
            
            const div = document.createElement('div');
            if (isBot) {
              div.className = 'chat-bubble chat-bot p-2 my-1';
              div.innerHTML = `<small class="d-block fw-bold opacity-75">🤖 ربات ALLIANCE AI</small>${m.text}`;
            } else {
              div.className = `chat-bubble ${isMe ? 'chat-me' : 'chat-other'}`;
              const badge = m.role === 'admin' ? '👑' : (m.role === 'co-leader' ? '⭐' : '⚔️');
              div.innerHTML = `<small class="d-block fw-bold opacity-75">${badge} ${m.name}</small>${m.text}`;
            }
            chatBox.appendChild(div);
          }
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();

      if (text) {
        const messagesRef = ref(db, 'messages');
        const newMsgRef = push(messagesRef);
        await set(newMsgRef, {
          sender: currentUser.username,
          name: currentUser.name,
          role: currentUser.role,
          text: text,
          timestamp: Date.now()
        });
        
        input.value = '';

        // پاسخ هوشمند ربات کلن
        setTimeout(async () => {
          const lower = text.toLowerCase();
          let botReply = "";
          if (lower.includes("سلام") || lower.includes("درود")) {
            botReply = `سلام ${currentUser.name} عزیز! به کلن ALLIANCE US خوش آمدی ⚔️`;
          } else if (lower.includes("قوانین")) {
            botReply = "احترام به اعضا و حضور فعال در وارها الزامی است! 🛡️";
          } else if (lower.includes("لیدر")) {
            botReply = "لیدر کلن به زودی پیام شما را پاسخ خواهد داد 👑";
          }

          if (botReply) {
            const botMsgRef = push(messagesRef);
            await set(botMsgRef, {
              sender: "bot",
              name: "Alliance AI",
              text: botReply,
              timestamp: Date.now()
            });
          }
        }, 800);
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
