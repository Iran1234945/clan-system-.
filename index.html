<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه مدیریت کلن ALLIANCE US</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(15, 23, 42, 0.85) !important;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .form-control, .form-select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 10px;
    }

    .form-control:focus, .form-select:focus {
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      border-color: #6366f1;
      box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
    }

    .btn-custom {
      background: linear-gradient(45deg, #6366f1, #8b5cf6);
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background: linear-gradient(45deg, #4f46e5, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      color: white;
    }

    .chat-box {
      height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .chat-me {
      align-self: flex-start;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .chat-other {
      align-self: flex-end;
      background: #334155;
      color: white;
      border-bottom-left-radius: 2px;
    }

    .table {
      color: #cbd5e1;
    }

    .table-dark {
      --bs-table-bg: rgba(15, 23, 42, 0.5);
    }

    .badge-status {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- هدر و ناوبری -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="#">
        ⚡️ ALLIANCE US ⚡️
      </a>
      <div id="userInfo" class="d-flex align-items-center gap-3"></div>
    </div>
  </nav>

  <div class="container my-4 flex-grow-1">
    
    <!-- بخش ورود و ثبت نام -->
    <div id="authSection" class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4">
          <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active text-white fw-bold" id="tab-login" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">ورود اعضا</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link text-white fw-bold" id="tab-register" data-bs-toggle="pill" data-bs-target="#pills-register" type="button">ثبت نام جدید</button>
            </li>
          </ul>

          <div class="tab-content" id="pills-tabContent">
            <!-- فرم ورود -->
            <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">نام کاربری</label>
                  <input type="text" id="loginUser" class="form-control" placeholder="نام کاربری خود را وارد کنید" required autocomplete="off">
                </div>
                <div class="mb-3">
                  <label class="form-label">رمز عبور</label>
                  <input type="password" id="loginPass" class="form-control" placeholder="رمز عبور" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2">ورود به سامانه</button>
              </form>
            </div>

            <!-- فرم ثبت نام -->
            <div class="tab-pane fade" id="pills-register" role="tabpanel">
              <form id="registerForm">
                <div class="mb-3">
                  <label class="form-label">نام و نام خانوادگی / نام در بازی</label>
                  <input type="text" id="regName" class="form-control" placeholder="مثال: علی - آریا" required autocomplete="off">
                </div>
                <div class="mb-3">
                  <label class="form-label">نام کاربری جهت ورود</label>
                  <input type="text" id="regUser" class="form-control" placeholder="حروف انگلیسی" required autocomplete="off">
                </div>
                <div class="mb-3">
                  <label class="form-label">رمز عبور</label>
                  <input type="password" id="regPass" class="form-control" placeholder="رمز عبور دلخواه" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2">ارسال درخواست عضویت</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- داشبورد اصلی پس از ورود -->
    <div id="mainDashboard" class="d-none">
      
      <!-- پنل لیدر / ادمین -->
      <div id="adminPanel" class="glass-card p-4 mb-4 d-none">
        <h4 class="mb-3 text-warning"><i class="fa-solid fa-user-shield me-2"></i>پنل مدیریت لیدر کلن</h4>
        
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead>
              <tr>
                <th>نام کاربر</th>
                <th>نام کاربری</th>
                <th>رمز عبور</th>
                <th>وضعیت</th>
                <th>عملیات</th>
              </tr>
            </thead>
            <tbody id="membersTable"></tbody>
          </table>
        </div>
      </div>

      <!-- چت‌روم آنلاین زنده -->
      <div class="glass-card p-4">
        <h4 class="mb-3"><i class="fa-solid fa-comments me-2 text-info"></i>چت‌روم زنده کلن ALLIANCE US</h4>
        <div id="chatBox" class="chat-box mb-3"></div>
        <form id="chatForm" class="d-flex gap-2">
          <input type="text" id="chatInput" class="form-control" placeholder="پیام خود را بنویسید..." autocomplete="off" required>
          <button type="submit" class="btn btn-custom px-4"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>

    </div>

  </div>

  <!-- اسکریپت فایربیس و منطق برنامه‌نویسی -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD25Qf8dy99c3xaE_M-cGBUTlAlcweUIiI",
      authDomain: "alliance-us.firebaseapp.com",
      databaseURL: "https://alliance-us-default-rtdb.firebaseio.com",
      projectId: "alliance-us",
      storageBucket: "alliance-us.firebasestorage.app",
      messagingSenderId: "26796202986",
      appId: "1:26796202986:web:60074204d795edf3407093",
      measurementId: "G-P8RRRH3V00"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;

    async function initAdmin() {
      const adminRef = ref(db, 'users/admin');
      const snapshot = await get(adminRef);
      if (!snapshot.exists()) {
        await set(adminRef, {
          name: "لیدر کلن",
          username: "admin",
          pass: "leader123",
          role: "admin",
          status: "approved"
        });
      }
    }
    initAdmin();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUser').value.trim().toLowerCase();
      const pass = document.getElementById('regPass').value.trim();

      if (!username || !pass || !name) return;

      const userRef = ref(db, `users/${username}`);
      const snapshot = await get(userRef);

      if (snapshot.exists()) {
        alert("این نام کاربری قبلاً ثبت شده است!");
      } else {
        await set(userRef, {
          name: name,
          username: username,
          pass: pass,
          role: "member",
          status: "pending"
        });
        alert("درخواست ثبت‌نام شما فرستاده شد. پس از تایید لیدر می‌توانید وارد شوید.");
        document.getElementById('registerForm').reset();
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value.trim();

      const userRef = ref(db, `users/${username}`);
      const snapshot = await get(userRef);

      if (snapshot.exists()) {
        const userData = snapshot.val();
        if (userData.pass === pass) {
          if (userData.status === "approved" || userData.role === "admin") {
            currentUser = userData;
            loadDashboard();
          } else {
            alert("حساب شما هنوز توسط لیدر تایید نشده است!");
          }
        } else {
          alert("رمز عبور اشتباه است!");
        }
      } else {
        alert("کاربری با این نام یافت نشد!");
      }
    });

    function loadDashboard() {
      document.getElementById('authSection').classList.add('d-none');
      document.getElementById('mainDashboard').classList.remove('d-none');

      document.getElementById('userInfo').innerHTML = `
        <span class="text-light"><i class="fa-solid fa-user me-1"></i>${currentUser.name} (${currentUser.role === 'admin' ? 'لیدر' : 'عضو'})</span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-danger">خروج</button>
      `;

      document.getElementById('logoutBtn').addEventListener('click', () => {
        location.reload();
      });

      if (currentUser.role === 'admin') {
        document.getElementById('adminPanel').classList.remove('d-none');
        listenToMembers();
      }

      listenToChat();
    }

    function listenToMembers() {
      const usersRef = ref(db, 'users');
      onValue(usersRef, (snapshot) => {
        const tbody = document.getElementById('membersTable');
        tbody.innerHTML = '';
        if (snapshot.exists()) {
          const users = snapshot.val();
          for (let key in users) {
            const u = users[key];
            if (u.role === 'admin') continue;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${u.name}</td>
              <td>${u.username}</td>
              <td>••••••••</td>
              <td>
                <span class="badge ${u.status === 'approved' ? 'bg-success' : 'bg-warning text-dark'} badge-status">
                  ${u.status === 'approved' ? 'تایید شده' : 'در انتظار تایید'}
                </span>
              </td>
              <td>
                ${u.status === 'pending' ? `<button onclick="approveUser('${u.username}')" class="btn btn-sm btn-success me-1">تایید</button>` : ''}
                <button onclick="deleteUser('${u.username}')" class="btn btn-sm btn-danger">حذف</button>
              </td>
            `;
            tbody.appendChild(tr);
          }
        }
      });
    }

    window.approveUser = async (username) => {
      await update(ref(db, `users/${username}`), { status: 'approved' });
    };

    window.deleteUser = async (username) => {
      if (confirm('آیا از حذف این عضو مطمئن هستید؟')) {
        await remove(ref(db, `users/${username}`));
      }
    };

    function listenToChat() {
      const messagesRef = ref(db, 'messages');
      onValue(messagesRef, (snapshot) => {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        if (snapshot.exists()) {
          const msgs = snapshot.val();
          for (let key in msgs) {
            const m = msgs[key];
            const isMe = m.sender === currentUser.username;
            const div = document.createElement('div');
            div.className = `chat-bubble ${isMe ? 'chat-me' : 'chat-other'}`;
            div.innerHTML = `<small class="d-block fw-bold opacity-75">${m.name}</small>${m.text}`;
            chatBox.appendChild(div);
          }
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();

      if (text) {
        const messagesRef = ref(db, 'messages');
        const newMsgRef = push(messagesRef);
        await set(newMsgRef, {
          sender: currentUser.username,
          name: currentUser.name,
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
