<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدیریت کلن</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --blue: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Tahoma, Segoe UI, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .box {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2, h3 {
            margin-bottom: 15px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: var(--blue);
        }
        button {
            background: var(--blue);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .btn-green {
            background: var(--green);
        }
        .btn-green:hover {
            background: #16a34a;
        }
        .btn-red {
            background: var(--red);
        }
        .btn-red:hover {
            background: #dc2626;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: right;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            background: var(--bg);
            color: var(--muted);
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
        }
        .badge-active {
            background: var(--green);
            color: white;
        }
        .badge-pending {
            background: #f59e0b;
            color: black;
        }
        .tab-btn {
            background: var(--border);
            color: var(--muted);
        }
        .tab-btn.active {
            background: var(--blue);
            color: white;
        }
    </style>
</head>
<body>

    <!-- صفحه ورود و ثبت نام -->
    <div id="authScreen" class="box">
        <h2>سامانه کلن</h2>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
            <button onclick="switchMode('login')" id="btnL" class="tab-btn active">ورود</button>
            <button onclick="switchMode('reg')" id="btnR" class="tab-btn">ثبت‌نام</button>
        </div>
        
        <div id="loginForm">
            <input type="text" id="lUser" placeholder="نام کاربری">
            <input type="password" id="lPass" placeholder="رمز عبور">
            <button onclick="loginUser()">ورود به سامانه</button>
        </div>

        <div id="regForm" style="display:none;">
            <input type="text" id="rUser" placeholder="نام کاربری دلخواه">
            <input type="password" id="rPass" placeholder="رمز عبور دلخواه">
            <button class="btn-green" onclick="registerUser()">ثبت‌نام (نیازمند تایید لیدر)</button>
        </div>
        
        <p style="font-size:0.8rem; color:var(--muted); margin-top:15px;">ادمین پیش‌فرض: admin / leader123</p>
    </div>

    <!-- پنل اصلی بعد از ورود -->
    <div id="mainPanel" style="display:none; max-width:900px; margin:0 auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--card); padding:15px 20px; border-radius:10px; border:1px solid var(--border);">
            <h2>خوش آمدید، <span id="uNameDisp" style="color:var(--blue)"></span></h2>
            <button onclick="location.reload()" class="btn-red" style="width:auto; padding:8px 18px;">خروج</button>
        </div>

        <!-- پنل مدیریت لیدر -->
        <div id="adminSection" style="display:none; background:var(--card); padding:20px; border-radius:10px; border:1px solid var(--border); margin-top:20px;">
            <h3>مدیریت اعضا و مشاهده رمزهای عبور (پنل لیدر)</h3>
            <p style="color:var(--muted); font-size:0.85rem; margin-bottom:10px;">اعضای جدید پس از تایید توسط شما، اجازه ورود به سامانه را خواهند داشت.</p>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>نام کاربری</th>
                            <th>رمز عبور</th>
                            <th>وضعیت</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="memberTable"></tbody>
                </table>
            </div>
        </div>

        <!-- پنل عضو عادی -->
        <div id="memberSection" style="display:none; background:var(--card); padding:30px; border-radius:10px; border:1px solid var(--border); margin-top:20px; text-align:center;">
            <h3>خوش آمدید عضو گرامی!</h3>
            <p style="color:var(--muted); margin-top:10px;">حساب شما تایید شده و به سامانه کلن دسترسی کامل دارید.</p>
        </div>
    </div>

    <script>
        function getDB() {
            let data = localStorage.getItem('clan_db');
            if(!data) {
                let defaultDB = {
                    users: [{ username: 'admin', pass: 'leader123', role: 'Leader', status: 'Active' }]
                };
                localStorage.setItem('clan_db', JSON.stringify(defaultDB));
                return defaultDB;
            }
            return JSON.parse(data);
        }

        function saveDB(db) {
            localStorage.setItem('clan_db', JSON.stringify(db));
        }

        function switchMode(m) {
            let lForm = document.getElementById('loginForm');
            let rForm = document.getElementById('regForm');
            let btnL = document.getElementById('btnL');
            let btnR = document.getElementById('btnR');

            if(m === 'login') {
                lForm.style.display = 'block';
                rForm.style.display = 'none';
                btnL.classList.add('active');
                btnR.classList.remove('active');
            } else {
                lForm.style.display = 'none';
                rForm.style.display = 'block';
                btnR.classList.add('active');
                btnL.classList.remove('active');
            }
        }

        function registerUser() {
            let u = document.getElementById('rUser').value.trim();
            let p = document.getElementById('rPass').value.trim();

            if(!u || !p) {
                alert('لطفاً نام کاربری و رمز عبور را وارد کنید.');
                return;
            }

            let db = getDB();
            if(db.users.some(function(x) { return x.username === u; })) {
                alert('این نام کاربری قبلاً ثبت شده است.');
                return;
            }

            db.users.push({ username: u, pass: p, role: 'Member', status: 'Pending' });
            saveDB(db);

            alert('ثبت‌نام با موفقیت انجام شد! منتظر تایید لیدر بمانید.');
            switchMode('login');
            document.getElementById('rUser').value = '';
            document.getElementById('rPass').value = '';
        }

        function loginUser() {
            let u = document.getElementById('lUser').value.trim();
            let p = document.getElementById('lPass').value.trim();

            if(!u || !p) {
                alert('لطفاً نام کاربری و رمز عبور را وارد کنید.');
                return;
            }

            let db = getDB();
            let user = null;

            for(let i = 0; i < db.users.length; i++) {
                if(db.users[i].username === u && db.users[i].pass === p) {
                    user = db.users[i];
                    break;
                }
            }

            if(!user) {
                alert('نام کاربری یا رمز عبور اشتباه است!');
                return;
            }

            if(user.status === 'Pending') {
                alert('⚠️ حساب شما هنوز توسط لیدر تایید نشده است.');
                return;
            }

            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
            document.getElementById('uNameDisp').innerText = user.username;

            if(user.role === 'Leader') {
                document.getElementById('adminSection').style.display = 'block';
                renderAdmin();
            } else {
                document.getElementById('memberSection').style.display = 'block';
            }
        }

        function renderAdmin() {
            let db = getDB();
            let tbody = document.getElementById('memberTable');
            tbody.innerHTML = '';

            for(let idx = 0; idx < db.users.length; idx++) {
                let m = db.users[idx];
                let stText = m.status === 'Active' ? 'فعال' : 'در انتظار تایید';
                let stClass = m.status === 'Active' ? 'badge-active' : 'badge-pending';

                let actionBtn = '';
                if(m.role !== 'Leader') {
                    if(m.status === 'Pending') {
                        actionBtn += '<button class="btn-green" style="padding:4px 8px; font-size:0.8rem; width:auto; margin-left:5px;" onclick="approveUser(' + idx + ')">تایید</button>';
                    }
                    actionBtn += '<button class="btn-red" style="padding:4px 8px; font-size:0.8rem; width:auto;" onclick="delUser(' + idx + ')">حذف</button>';
                } else {
                    actionBtn = '<span style="color:var(--muted)">مدیر کل</span>';
                }

                let row = '<tr>' +
                    '<td><strong>' + m.username + '</strong></td>' +
                    '<td><code style="background:#0f172a; padding:3px 6px; border-radius:4px; color:var(--green);">' + m.pass + '</code></td>' +
                    '<td><span class="badge ' + stClass + '">' + stText + '</span></td>' +
                    '<td>' + actionBtn + '</td>' +
                '</tr>';

                tbody.innerHTML += row;
            }
        }

        function approveUser(idx) {
            let db = getDB();
            db.users[idx].status = 'Active';
            saveDB(db);
            renderAdmin();
            alert('حساب کاربر تایید شد.');
        }

        function delUser(idx) {
            if(confirm('آیا از حذف این کاربر مطمئن هستید؟')) {
                let db = getDB();
                db.users.splice(idx, 1);
                saveDB(db);
                renderAdmin();
            }
        }
    </script>
</body>
</html>
